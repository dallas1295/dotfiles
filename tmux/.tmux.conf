set -g default-terminal "xterm-256color"
set -ag terminal-overrides ",xterm-256color:RGB,screen-256color:RGB"

set -g mouse on

set -g prefix C-SPACE
set -g base-index 1
set -g renumber-windows on
set -g status-position top
set -g status-justify absolute-centre

# Vague Color Reference (gruber-darker):
# bg: #181818 (dark background)
# inactiveBg: #282828 (lighter background)
# line: #453d41 (line/highlight)
# comment: #cc8c3c (brown)
# builtin: #ffdd33 (yellow)
# constant: #95a99f (quartz)
# error: #f43841 (red)
# keyword: #ffdd33 (yellow)
# string: #73d936 (green)
# number: #9e95c7 (wisteria)
#
set -g window-status-current-style "fg=#ffdd33,bold"
set -g window-status-format "#[fg=#9e95c7]#W"
set -g window-status-current-format "#W"
set -g window-status-separator "#[fg=#95a99f] | "
set -g status-style "bg=default"
set -g pane-border-style "fg=#252530"
set -g pane-active-border-style "fg=#ffdd33"
set -g pane-border-format "#[fg=#47b413]#{pane_current_command}"
set -g mode-style "bg=#cc8c3c fg=#141415"
set -g status-left "#[fg=#ffdd33,bold]   #S"
set -g status-right ""


# Window management
unbind n
bind n new-window -c ""
unbind c
bind c new-session -c "#{pane_current_path}"
bind b break-pane
bind Tab next-window
unbind x
bind x kill-pane
bind l split-window -h -p 50 -c "#{pane_current_path}"
bind J split-window -v -p 40 -c "#{pane_current_path}"
bind j split-window -v -p 20 -c "#{pane_current_path}"
bind k split-window -h -p 35 -c "#{pane_current_path}"
bind a split-window -h -p 35 -c "#{pane_current_path}" opencode



# Reload config
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Custom scripts
bind G neww -n "lazygit" lazygit
bind E show-environment -g

# TPM path
set-environment -g TMUX_PLUGIN_MANAGER_PATH "~/.tmux/plugins/"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @continuum-restore 'on'
set -g @continuum-boot 'on'
set -g @continuum-save-interval '15'
set -g @resurrect-capture-pane-contents 'on'
# never let an empty snapshot clobber a good 'last' (happens on shutdown races)
set -g @resurrect-hook-pre-save-shell "test -n \"$(tmux list-sessions 2>/dev/null)\""

# Initialize TPM (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
