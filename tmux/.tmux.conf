set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB,tmux-256color:RGB"

set -g mouse on

set -g prefix C-SPACE
set -g base-index 1
set -g renumber-windows on
set -g status-position top
set -g status-justify absolute-centre

# Gruvbox Dark Hard Color Reference:
# bg: #1d2021 (dark background)
# bg-alt: #3c3836 (lighter background)
# fg: #ebdbb2 (light foreground)
# gray: #928374 (dim foreground)
# blue: #83a598 (cyan)
# pink: #d3869b (pink)
# green: #b8bb26 (green)
# red: #fb4934 (red)
# yellow: #fabd2f (yellow)
# purple: #d3869b (purple)
#
set -g window-status-current-style "fg=#b8bb26,bold"
set -g window-status-format "#[fg=#928374]#W"
set -g window-status-current-format "#W"
set -g window-status-separator "#[fg=#928374] | "
set -g status-style "bg=default"
set -g pane-border-style "fg=#3c3836"
set -g pane-active-border-style "fg=#b8bb26"
set -g pane-border-format "#{pane_current_commant}"
set -g mode-style "bg=#83a598 fg=#1d2021"
set -g status-left "#[fg=#d3869b,bold]   #S"
set -g status-right ""
# set -g status-right "#[fg=#24A1AD]  #{cpu}  #{mem}"


# Window management
unbind n
bind n new-window
unbind c
bind c new-session
bind b break-pane
bind Tab next-window
unbind x
bind x kill-pane
bind l split-window -h -p 50
bind J split-window -v -p 40
bind j split-window -v -p 20



# Reload config
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Custom scripts
bind G neww -n "lazygit" lazygit
bind E show-environment -g

# TPM path
set-environment -g TMUX_PLUGIN_MANAGER_PATH "~/.tmux/plugins/"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @continuum-restore 'on'
set -g @continuum-boot 'on'
set -g @continuum-save-interval '15'

# Initialize TPM (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
