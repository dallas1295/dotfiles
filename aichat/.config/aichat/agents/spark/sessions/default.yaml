    You're absolutely right. rsonist's use of `HashMap` means keys get sorted alphabetically on serialization, which breaks your original JSON structure. `serde_json` handles this better.

    **serde_json uses `BTreeMap` internally** (which preserves insertion order), so it maintains your original structure. Here's how you edit in place with serde_json:

    ```rust
    use serde_json::Value;

    // Read from file
    let mut json_content = std::fs::read_to_string("issues.json").unwrap();
    let mut root: Value = serde_json::from_str(&json_content).unwrap();

    // Find and modify the object by ID
    if let Some(arr) = root.as_array_mut() {
        for item in arr.iter_mut() {
            if let Some(obj) = item.as_object_mut() {
                if let Some(id) = obj.get("id") {
                    if id.as_str() == Some("1") {
                        // Modify this object's properties
                        obj.insert("priority".to_string(), "high".into());
                        obj.insert("status".to_string(), "open".into());
                        break;
                    }
                }
            }
        }
    }

    // Write back to file (preserves insertion order)
    std::fs::write("issues.json", &root.to_string()).unwrap();
    ```

    **Key differences:**
    1. `serde_json::Value::Object` uses `BTreeMap` (preserves insertion order)
    2. `serde_json::Value::Array` uses `Vec` (preserves order)
    3. You can chain `as_array_mut()` → `get_mut()` → `as_object_mut()` to navigate and modify

    **For more ergonomic editing**, serde_json also supports deserializing directly into structs:

    ```rust
    use serde::{Deserialize, Serialize};

    #[derive(Debug, Deserialize, Serialize)]
    struct Issue {
        id: i32,
        title: String,
        status: String,
        priority: String,
    }

    // Deserialize into struct (type-safe)
    let issues: Vec<Issue> = serde_json::from_str(&json_content).unwrap();

    // Modify struct
    for issue in issues.iter_mut() {
        if issue.id == 1 {
            issue.status = "open".to_string();
            issue.priority = "high".to_string();
        }
    }

    // Serialize back (preserves order if you define struct fields in order)
    let new_json = serde_json::to_string_pretty(&issues).unwrap();
    std::fs::write("issues.json", &new_json).unwrap();
    ```

    **serde_json wins here because:**
    - Maintains insertion order (no alphabetical sorting)
    - Provides higher-level navigation methods (`as_array_mut()`, `get_mut()`, `as_object_mut()`)
    - Supports both raw `Value` manipulation and type-safe struct deserialization

