$font = JetBrains Mono Nerd Font

# GENERAL
general {
    disable_loading_bar = false
    hide_cursor = false
    loading_color = rgba(230, 195, 132, 1)  # Kanagawa Dragon yellow (#e6c384)
}

# BACKGROUND
background {
    monitor =
    image = /home/dallas/.wallpapers/arch-wavy.png
    # color = rgba(29, 28, 25, 1)  # Kanagawa Dragon base0 (#1d1c19)
}

# TIME
label {
    monitor =
    text = cmd[update:30000] echo "$(date +"%R")"
     color = rgba(135, 169, 135, 1)  # Kanagawa Dragon green (#87a987)
    font_size = 90
    font_family = $font
    position = 0, -150
    halign = center
    valign = center
}

# DATE
label {
    monitor =
    text = cmd[update:43200000] echo "$(date +"%A, %d %B %Y")"
     color = rgba(200, 196, 180, 1)  # Kanagawa Dragon white (#c8c4b4)
    font_size = 25
    font_family = $font
    position = 0, -220
    halign = center
    valign = center
}

# USER AVATAR
image {
    monitor =
    path =
    size = 100
     border_color = rgba(160, 154, 140, 1)  # Kanagawa Dragon ash (#a09a8c)
    position = 0, 75
    halign = center
    valign = center
}

# INPUT FIELD
input-field {
    monitor =
    size = 300, 60
    outline_thickness = 2
    outline_radius = 0  # Square corners (set to 0, or remove if not supported)
    outline_color = rgba(160, 154, 140, 1)  # Kanagawa Dragon ash (#a09a8c)
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    font_color = rgba(29, 28, 25, 1)  # Kanagawa Dragon base0 (#1d1c19)
    fade_on_empty = true
    placeholder_text = <span><i>󰌾 Logged in as </i>$USER</span>
    hide_input = false
    check_color = rgba(135, 169, 135, 1)   # Kanagawa Dragon green (#87a987)
    fail_color = rgba(197, 70, 75, 1)     # Kanagawa Dragon red (#c5464b)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = rgba(230, 195, 132, 1) # Kanagawa Dragon yellow (#e6c384)
    position = 0, 0
    halign = center
    valign = center
    background = rgba(200, 196, 180, 1)  # Kanagawa Dragon white (#c8c4b4)
}
