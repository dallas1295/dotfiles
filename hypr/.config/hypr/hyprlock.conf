$font = JetBrains Mono Nerd Font

# GENERAL
general {
    disable_loading_bar = false
    hide_cursor = false
    loading_color = rgba(216, 166, 87, 1)  # Gruvbox yellow (#d8a657)
}

# BACKGROUND
background {
    monitor =
    color = rgba(0, 0, 0, 1)
}

# TIME
label {
    monitor =
    text = cmd[update:30000] echo "$(date +"%R")"
     color = rgba(212, 190, 152, 1)  # Gruvbox fg (#d4be98)
    font_size = 90
    font_family = $font
    position = 0, -150
    halign = center
    valign = center
}

# DATE
label {
    monitor =
    text = cmd[update:43200000] echo "$(date +"%A, %d %B %Y")"
     color = rgba(212, 190, 152, 1)  # Gruvbox fg (#d4be98)
    font_size = 25
    font_family = $font
    position = 0, -220
    halign = center
    valign = center
}

# USER AVATAR
image {
    monitor =
    path = ~/
    size = 100
     border_color = rgba(68, 71, 90, 1)
    position = 0, 75
    halign = center
    valign = center
}

# INPUT FIELD
input-field {
    monitor =
    size = 300, 60
    outline_thickness = 2
    outline_radius = 0  # Square corners (set to 0, or remove if not supported)
    outline_color = rgba(0, 0, 0, 1)
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    font_color = rgba(0, 0, 0, 1)
    fade_on_empty = true
    placeholder_text = <span><i>󰌾 Logged in as </i>$USER</span>
    hide_input = false
    check_color = rgba(169, 182, 101, 1)   # Gruvbox green (#a9b665)
    fail_color = rgba(234, 105, 98, 1)     # Gruvbox red (#ea6962)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = rgba(216, 166, 87, 1) # Gruvbox yellow (#d8a657)
    position = 0, 0
    halign = center
    valign = center
    background = rgba(212, 190, 152, 1)
}
