$font = Geist Mono Nerd Font

# GENERAL
general {
    disable_loading_bar = false
    hide_cursor = false
}

# BACKGROUND
background {
    monitor =
    path = ~/.config/hypr/backgrounds/mono_forest.jpg
    blur_passes = 2
     color = rgba(40, 42, 54, 1)  # Dracula (#282a36)
}

# TIME
label {
    monitor =
    text = cmd[update:30000] echo "$(date +"%R")"
     color = rgba(248, 248, 242, 1)  # Dracula fg (#f8f8f2)
    font_size = 90
    font_family = $font
    position = -30, 0
    halign = right
    valign = top
}

# DATE
label {
    monitor =
    text = cmd[update:43200000] echo "$(date +"%A, %d %B %Y")"
     color = rgba(248, 248, 242, 1)  # Dracula fg (#f8f8f2)
    font_size = 25
    font_family = $font
    position = -30, -150
    halign = right
    valign = top
}

# USER AVATAR
image {
    monitor =
    path = ~/
    size = 100
     border_color = rgba(68, 71, 90, 1)  # Dracula (#44475a)
    position = 0, 75
    halign = center
    valign = center
}

# INPUT FIELD
input-field {
    monitor =
    size = 300, 60
    outline_thickness = 2
    outline_radius = 0  # Square corners (set to 0, or remove if not supported)
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
     font_color = rgba(248, 248, 242, 1)  # Dracula fg (#f8f8f2)
    fade_on_empty = false
    placeholder_text = <span><i>󰌾 Logged in as </i>$USER</span>
    hide_input = false
     check_color = rgba(80, 250, 123, 1)   # Dracula green (#50fa7b)
     fail_color = rgba(255, 85, 85, 1)     # Dracula red (#ff5555)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
     capslock_color = rgba(241, 250, 140, 1) # Dracula yellow (#f1fa8c)
    position = 0, -35
    halign = center
    valign = center
     background = rgba(39, 40, 50, 1)  # Dracula for input field
}
