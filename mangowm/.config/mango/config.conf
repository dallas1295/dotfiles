# MangoWM config - transposed from niri config

# ── Environment ──
env=ELECTRON_OZONE_PLATFORM_HINT,auto
env=XCURSOR_SIZE,20

# ── Monitors ──
monitorrule=name:^eDP-1$,width:2880,height:1800,refresh:120,scale:1.6,x:0,y:0
monitorrule=name:^HDMI-A-1$,width:1920,height:1080,refresh:144,scale:1,x:1800,y:0

# ── Input ──
xkb_rules_layout=us
xkb_rules_options=caps:escape

mouse_accel_profile=1

trackpad_natural_scrolling=1
trackpad_accel_profile=1
disable_while_typing=0
trackpad_scroll_factor=0.35

cursor_size=20
sloppyfocus=1
warpcursor=0

# ── Layout ──
scroller_default_proportion=0.85
scroller_proportion_preset=0.3333,0.5,0.6667,0.85
scroller_structs=3
scroller_focus_center=0
scroller_prefer_overspread=1

default_mfact=0.55
default_nmaster=1
new_is_master=0

# ── Visuals ──
borderpx=1
gappih=3
gappiv=3
gappoh=3
gappov=3

focuscolor=0x8992a7ff
bordercolor=0x1a1b26ff

focused_opacity=0.95
unfocused_opacity=0.85
border_radius=5

blur=1
blur_params_radius=2
blur_params_num_passes=2
blur_optimized=1

shadows=0

rootcolor=0x000000ff

# ── Misc ──
focus_on_activate=1
xwayland_persistence=1

# ── Tag rules ──
tagrule=id:1,layout_name:scroller,no_hide:1
tagrule=id:2,layout_name:scroller,no_hide:1
tagrule=id:3,layout_name:scroller,no_hide:1
tagrule=id:4,layout_name:scroller,no_hide:1

# ── Window rules ──
windowrule=tags:1,appid:com.mitchellh.ghostty
windowrule=scroller_proportion:0.7,appid:com.mitchellh.ghostty

windowrule=tags:2,appid:zen
windowrule=tags:2,appid:brave-browser
windowrule=tags:2,appid:brave-bin
windowrule=tags:2,appid:helium
windowrule=tags:2,appid:firefox
windowrule=tags:2,appid:v2rayN
windowrule=isfloating:1,isopensilent:1,appid:Mullvad VPN

windowrule=tags:3,appid:steam
windowrule=tags:3,isopensilent:1,appid:discord
windowrule=tags:3,isopensilent:1,appid:heroic
windowrule=tags:3,appid:spotify
windowrule=tags:3,appid:org.prismlauncher.PrismLauncher

windowrule=tags:4,appid:Bitwarden

windowrule=isfloating:1,isopensilent:1,title:Picture-in-picture
windowrule=isfloating:1,isopensilent:1,title:Picture in picture

windowrule=isterm:1,appid:com.mitchellh.ghostty

# ── Autostart ──
exec-once=waybar
exec-once=swaybg -m fill -i ~/.wallpapers/forest.jpg
exec-once=swayidle -w timeout 300 'brightnessctl -s set 10%' resume 'brightnessctl -r' timeout 420 'swaylock -f' timeout 600 'mmsg -d disable_monitor,eDP-1' resume 'mmsg -d enable_monitor,eDP-1' before-sleep 'swaylock -f'
exec-once=kanshi
exec-once=ghostty
exec-once=wl-paste --type text --watch cliphist store
exec-once=wl-paste --type image --watch cliphist store
exec-once=syncthing

# ── Keybinds ──

# Apps
bind=SUPER,Return,spawn,ghostty
bind=SUPER,Q,killclient
bind=SUPER,B,spawn,brave
bind=SUPER,M,spawn,spotify
bind=SUPER,E,spawn,ghostty -e yazi
bind=SUPER,I,spawn,ghostty -e btop
bind=SUPER,space,spawn,rofi -show drun
bind=ALT,space,spawn,rofi -show drun
bind=SUPER+SHIFT,space,spawn,rofi -show run
bind=SUPER+ALT,L,spawn,swaylock
bind=SUPER+SHIFT,P,spawn,rofi -show power-menu -modi power-menu:rofi-power-menu
bind=SUPER,W,spawn,hiddify
bind=SUPER+ALT,S,spawn,ghostty -e bluetui
bind=SUPER,G,spawn_shell,gtk-launch "Steam (No VPN)"

# Screenshots
bind=SUPER,S,spawn_shell,grim -g "$(slurp)" ~/Pictures/Screenshots/region-$(date +%Y%m%d-%H%M%S).png
bind=SUPER+SHIFT,S,spawn_shell,grim ~/Pictures/Screenshots/screen-$(date +%Y%m%d-%H%M%S).png

# Focus
bind=SUPER,H,focusdir,left
bind=SUPER,L,focusdir,right
bind=SUPER,J,focusstack,next
bind=SUPER,K,focusstack,prev

# Move windows
bind=SUPER+SHIFT,H,exchange_client,left
bind=SUPER+SHIFT,L,exchange_client,right
bind=SUPER+SHIFT,J,exchange_stack_client,next
bind=SUPER+SHIFT,K,exchange_stack_client,prev

# Tag switching (1-6)
bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER,3,view,3
bind=SUPER,4,view,4
bind=SUPER,5,view,5
bind=SUPER,6,view,6

# Move window to tag
bind=SUPER+CTRL,1,tag,1
bind=SUPER+CTRL,2,tag,2
bind=SUPER+CTRL,3,tag,3
bind=SUPER+CTRL,4,tag,4
bind=SUPER+CTRL,5,tag,5
bind=SUPER+CTRL,6,tag,6

# Cycle tags
bind=SUPER,N,viewtoright
bind=SUPER,P,viewtoleft

# Scroller column width
bind=SUPER,R,switch_proportion_preset
bind=SUPER,F,togglemaximizescreen
bind=SUPER+ALT,F,togglefullscreen
bind=SUPER,V,togglefloating

# Monitor focus
bind=SUPER,Period,focusmon,right
bind=SUPER,Comma,focusmon,left
bind=SUPER+SHIFT,Period,tagmon,right
bind=SUPER+SHIFT,Comma,tagmon,left

# Overview
bind=SUPER,O,toggleoverview

# System
bind=SUPER+SHIFT,End,quit
bind=SUPER+SHIFT,R,zoom

# Volume
bindl=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindl=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl=NONE,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Brightness
bindl=NONE,XF86MonBrightnessUp,spawn,brightnessctl s 5%+
bindl=NONE,XF86MonBrightnessDown,spawn,brightnessctl s 5%-

# Media
bindl=NONE,XF86AudioNext,spawn,playerctl next
bindl=NONE,XF86AudioPause,spawn,playerctl play-pause
bindl=NONE,XF86AudioPlay,spawn,playerctl play-pause
bindl=NONE,XF86AudioPrev,spawn,playerctl previous
